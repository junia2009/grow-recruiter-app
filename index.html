<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GROWモデル ワークシート</title>
  <link rel="apple-touch-icon" type="image/png" href="icon.png" />
  <style>
          .step-panel {
            padding-bottom: 48px !important;
          }
          #growFormPanel {
            padding-bottom: 48px;
          }
      /* アニメーション */
      .fadein { opacity: 0; transform: translateY(24px); animation: fadein-move 0.8s cubic-bezier(.33,1.02,.54,.99) 0.1s forwards; }
      .slidein { opacity: 0; transform: translateX(-32px); animation: slidein-move 0.7s cubic-bezier(.33,1.02,.54,.99) 0.2s forwards; }
      @keyframes fadein-move { to { opacity: 1; transform: none; } }
      @keyframes slidein-move { to { opacity: 1; transform: none; } }
    :root {
      --bg: #0a0a0f;
      --card: rgba(18,18,28,0.92);
      --accent: #e62429;
      --accent-gold: #f0c040;
      --muted: #8a8e97;
      --text: #f0eee8;
      --border: #2a1a1a;
      --label: #f0c040;
      --shadow: 0 8px 40px rgba(230,36,41,0.12);
      --radius: 14px;
      --input-bg: #141420;
      --input-border: #3a2020;
      --input-focus: rgba(230,36,41,0.25);
      --btn-hover: #b91c20;
      --secondary: #1a1a28;
    }
    html,body { height: 100%; }
    body {
      font-family: 'Segoe UI', 'Inter', 'Noto Sans JP', ui-sans-serif, system-ui, Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      letter-spacing: 0.01em;
      overflow-x: hidden;
    }
    /* === Iron Man HUD Background === */
    #hud-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    #hud-bg canvas { width: 100%; height: 100%; }
    .arc-reactor {
      position: fixed;
      top: 50%; left: 50%;
      width: 420px; height: 420px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79,200,255,0.07) 0%, rgba(79,200,255,0.02) 40%, transparent 70%);
      box-shadow: 0 0 120px 40px rgba(79,200,255,0.04), inset 0 0 80px 20px rgba(79,200,255,0.03);
      animation: arc-pulse 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes arc-pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%,-50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%,-50%) scale(1.08); }
    }
    .hud-ring {
      position: fixed;
      top: 50%; left: 50%;
      border-radius: 50%;
      border: 1px solid rgba(240,192,64,0.08);
      pointer-events: none; z-index: 0;
    }
    .hud-ring-1 { width: 600px; height: 600px; transform: translate(-50%,-50%); animation: hud-spin 60s linear infinite; }
    .hud-ring-2 { width: 500px; height: 500px; transform: translate(-50%,-50%); animation: hud-spin 45s linear infinite reverse; border-color: rgba(230,36,41,0.06); }
    .hud-ring-3 { width: 320px; height: 320px; transform: translate(-50%,-50%); animation: hud-spin 30s linear infinite; border-color: rgba(79,200,255,0.06); }
    @keyframes hud-spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
    .container {
      position: relative; z-index: 1;
      max-width: 820px;
      margin: 36px auto 0 auto;
      background: var(--card);
      padding: 36px 32px 28px 32px;
      border-radius: var(--radius);
      box-shadow: var(--shadow), 0 0 60px rgba(230,36,41,0.06);
      border: 1.5px solid var(--border);
      backdrop-filter: blur(12px);
    }
    h1 {
      font-size: 2.1rem;
      margin: 0 0 8px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 0 20px rgba(230,36,41,0.3), 0 0 40px rgba(230,36,41,0.1);
    }
    .subtitle {
      color: var(--muted);
      margin: 0 0 18px;
      font-size: 1.08rem;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: 600;
      color: var(--label);
      letter-spacing: 0.01em;
    }
    textarea, input[type=text], select {
      width: 100%;
      padding: 13px 14px;
      margin-top: 7px;
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      transition: box-shadow .18s, border-color .14s, background .14s;
      outline: none;
      box-shadow: none;
    }
    textarea:focus, input[type=text]:focus, select:focus {
      border-color: var(--accent);
      background: #232c3a;
      box-shadow: 0 0 0 2px var(--input-focus);
    }
    .row { display: flex; gap: 14px; }
    .col { flex: 1; }
    .btn {
      margin-top: 14px;
      padding: 11px 22px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #c41e22 100%);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background .14s, transform .12s, box-shadow .12s;
      box-shadow: 0 2px 16px rgba(230,36,41,0.18);
      letter-spacing: 0.01em;
    }
    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 24px rgba(230,36,41,0.25), 0 0 16px rgba(230,36,41,0.15);
    }
    .secondary {
      background: var(--secondary);
      color: var(--accent-gold);
      border: 1.5px solid var(--input-border);
      font-weight: 500;
      margin-top: 14px;
      transition: background .14s, color .14s, border-color .14s;
    }
    .secondary:hover {
      background: #1e1420;
      color: #fff;
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px rgba(240,192,64,0.12);
    }
    .sessions {
      margin-top: 28px;
      padding-top: 10px;
    }
    .session-item {
      padding: 16px 18px;
      border-radius: 10px;
      background: linear-gradient(90deg,#12121e 60%,#1a1428 100%);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.15);
      border: 1.2px solid var(--input-border);
      transition: transform .12s, box-shadow .12s, border-color .14s;
    }
    .session-item:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 18px 40px rgba(230,36,41,0.10), 0 0 20px rgba(240,192,64,0.06);
      border-color: var(--accent);
    }
    .actions button {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .18s, transform .18s;
    }
    .session-item:hover .actions button {
      opacity: 1;
      transform: translateY(0);
    }
    .session-meta small {
      color: var(--muted);
    }
    .actions button {
      margin-left: 10px;
    }
    footer {
      margin-top: 32px;
      font-size: 13px;
      color: #7a7e87;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .hero {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 22px 18px 18px 18px;
      border-radius: var(--radius);
      background: linear-gradient(135deg,#12121e 0%,#1a0a0a 50%,#12121e 100%);
      margin-bottom: 22px;
      box-shadow: 0 4px 24px rgba(230,36,41,0.08), 0 0 60px rgba(230,36,41,0.04);
      border: 1.2px solid rgba(230,36,41,0.15);
    }
    .hero .lead {
      font-weight: 700;
      color: var(--accent);
    }
    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
    }
    .tryBtn {
      background: transparent;
      border: 1.5px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      transition: background .14s, color .14s, border-color .14s;
    }
    .tryBtn:hover {
      background: var(--accent-gold);
      color: #0a0a0f;
      border-color: #fff;
    }
    /* Modal styles */
    #editModal {
      position: fixed; left: 0; top: 0; right: 0; bottom: 0;
      display: none; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-overlay {
      position: absolute; left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
    }
    .modal {
      position: relative; z-index: 2;
      background: var(--card);
      padding: 22px 18px;
      border-radius: var(--radius);
      max-width: 720px; width: 94%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.18);
      border: 1.2px solid var(--input-border);
    }
    #editModal textarea, #editModal input[type=text] { width: 100%; }
    #historyModal .modal { max-width: 600px; }
    .sr-only {
      position: absolute!important; height: 1px; width: 1px; overflow: hidden;
      clip: rect(1px,1px,1px,1px); white-space: nowrap;
    }
    .theme-select {
      margin-left: 12px; padding: 7px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      transition: border-color .14s, background .14s;
    }
    .theme-select:focus {
      border-color: var(--accent);
      background: #232c3a;
    }
    /* ripple */
    .btn, .secondary { position: relative; overflow: hidden }
    .ripple {
      position: absolute; border-radius: 50%; transform: scale(0);
      background: rgba(255,255,255,0.18); pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(4); opacity: 0 } }
    /* toast */
    #toast {
      position: fixed; right: 20px; bottom: 24px;
      background: linear-gradient(135deg, var(--accent) 0%, #c41e22 100%);
      color: #fff;
      padding: 12px 18px; border-radius: 10px;
      box-shadow: 0 8px 30px rgba(230,36,41,0.25);
      display: none;
      font-size: 1rem;
      z-index: 2000;
    }
    /* HUD scan line */
    .hud-scanline {
      position: fixed; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(79,200,255,0.08) 30%, rgba(240,192,64,0.06) 70%, transparent 100%);
      z-index: 0; pointer-events: none;
      animation: scanline 8s linear infinite;
    }
    @keyframes scanline {
      0% { top: -2px; }
      100% { top: 100vh; }
    }
    /* Corner HUD decorations */
    .hud-corner {
      position: fixed; width: 60px; height: 60px;
      pointer-events: none; z-index: 0; opacity: 0.15;
    }
    .hud-corner-tl { top: 16px; left: 16px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .hud-corner-tr { top: 16px; right: 16px; border-top: 2px solid var(--accent-gold); border-right: 2px solid var(--accent-gold); }
    .hud-corner-bl { bottom: 16px; left: 16px; border-bottom: 2px solid var(--accent-gold); border-left: 2px solid var(--accent-gold); }
    .hud-corner-br { bottom: 16px; right: 16px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  </style>
</head>
<body>
  <!-- Iron Man HUD Background -->
  <div class="arc-reactor"></div>
  <div class="hud-ring hud-ring-1"></div>
  <div class="hud-ring hud-ring-2"></div>
  <div class="hud-ring hud-ring-3"></div>
  <div class="hud-scanline"></div>
  <div class="hud-corner hud-corner-tl"></div>
  <div class="hud-corner hud-corner-tr"></div>
  <div class="hud-corner hud-corner-bl"></div>
  <div class="hud-corner hud-corner-br"></div>
  <canvas id="hudCanvas"></canvas>
  <div class="container fadein">
    <div class="hero slidein">
      <div>
        <h1>GROWモデル ワークシート</h1>
        <div class="subtitle">目標達成に向けて現状を整理し、具体的な行動を検討するためのシンプルなワークシートです。</div>
              <p style="margin-top:18px; display:flex; gap:12px; align-items:center;">
                <button id="openFormBtn" class="btn" type="button">フォームを開く</button>
                <button id="reloadBtn" class="btn secondary" type="button">トップへボタン</button>
              </p>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <!-- テーマ選択UI削除 -->
      </div>
    </div>

    <div id="growFormPanel" class="fadein" style="max-height:0;overflow:hidden;transition:max-height .7s cubic-bezier(.33,1.02,.54,.99),opacity .5s;opacity:0;">
      <form id="stepForm" autocomplete="off" style="margin:0;">
        <div id="stepIndicator" class="step-indicator"></div>
        <div class="step-panel step-0 animated-step" style="display:none">
          <label for="candidateSelect">候補者名</label>
          <div class="row">
            <div class="col">
              <select id="candidateSelect"></select>
            </div>
            <div class="col" style="flex:0 0 220px;display:flex;gap:8px">
              <input id="newCandidate" type="text" placeholder="新しい候補者名" aria-label="新しい候補者名" />
              <button id="addCandidate" class="secondary" type="button">追加</button>
            </div>
          </div>
          <div class="step-btn-wrap" style="margin-bottom: 36px;"><button type="button" class="btn next-btn step-next-main">次へ</button></div>
        </div>
        <div class="step-panel step-1 animated-step" style="display:none">
          <label for="goal">Goal（目標）</label>
          <textarea id="goal" rows="2" placeholder="例: 候補者の強みを活かした役割を提案する"></textarea>
          <div class="step-btn-wrap">
            <button type="button" class="btn next-btn step-next-main">次へ</button>
          </div>
        </div>
        <div class="step-panel step-2 animated-step" style="display:none">
          <label for="reality">Reality（現状）</label>
          <textarea id="reality" rows="3" placeholder="例: 現職での実績や観察されたスキル"></textarea>
          <div class="step-btn-wrap">
            <button type="button" class="btn next-btn step-next-main">次へ</button>
          </div>
        </div>
        <div class="step-panel step-3 animated-step" style="display:none">
          <label for="options">Options（選択肢／活用案）</label>
          <textarea id="options" rows="3" placeholder="例: トレーニング、異動、面接での強調点"></textarea>
          <div class="step-btn-wrap">
            <button type="button" class="btn next-btn step-next-main">次へ</button>
          </div>
        </div>
        <div class="step-panel step-4 animated-step" style="display:none">
          <label for="will">Will（次の行動）</label>
          <textarea id="will" rows="2" placeholder="例: 次回面談で深堀する項目、提案期限"></textarea>
          <div class="step-btn-wrap" style="margin-bottom:36px;"></div>
          <div id="formError" role="alert" aria-live="assertive" style="color:#a00;margin-top:8px;display:none"></div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:12px;">
            <button id="save" class="btn" type="button">セッションを保存</button>
            <button id="newSession" class="secondary" type="button">新規クリア</button>
            <button id="export" class="secondary" type="button">エクスポート（JSON）</button>
            <button id="exportCSV" class="secondary" type="button">エクスポート（CSV）</button>
            <button id="printPdf" class="secondary" type="button">PDF（印刷）</button>
            <input id="importFile" type="file" accept="application/json" style="display:none" />
            <button id="importBtn" class="secondary" type="button">インポート</button>
          </div>
        </div>
      </form>
    </div>

    <div class="sessions">
      <h3>保存セッション</h3>
      <div id="sessionsList"></div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" style="display:none" aria-hidden="true">
      <div class="modal-overlay"></div>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
        <h3 id="editModalTitle">セッション編集</h3>
        <label for="modalCandidate">候補者名</label>
        <input id="modalCandidate" type="text" />
        <label for="modalGoal">Goal（目標）</label>
        <textarea id="modalGoal" rows="2"></textarea>
        <label for="modalReality">Reality（現状）</label>
        <textarea id="modalReality" rows="3"></textarea>
        <label for="modalOptions">Options（選択肢）</label>
        <textarea id="modalOptions" rows="3"></textarea>
        <label for="modalWill">Will（次の行動）</label>
        <textarea id="modalWill" rows="2"></textarea>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="modalSave" type="button" class="btn">更新して閉じる</button>
          <button id="modalCancel" class="secondary" type="button">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" style="display:none" aria-hidden="true">
      <div class="modal-overlay"></div>
      <div class="modal">
        <h3>セッション履歴</h3>
        <div id="historyList" style="max-height:360px;overflow:auto;margin-top:8px"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="historyClose" class="secondary" type="button">閉じる</button>
        </div>
      </div>
    </div>

  <script>
    const KEY = 'grow_sessions_v1'
    function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

    function load(){
      try{const v = localStorage.getItem(KEY); return v?JSON.parse(v):[] }catch(e){return[]}
    }
    function saveAll(sessions){ localStorage.setItem(KEY, JSON.stringify(sessions)) }

    const candidateSelect = document.getElementById('candidateSelect')
    const newCandidate = document.getElementById('newCandidate')
    const addCandidateBtn = document.getElementById('addCandidate')
    const goal = document.getElementById('goal')
    const reality = document.getElementById('reality')
    const optionsEl = document.getElementById('options')
    const will = document.getElementById('will')
    const saveBtn = document.getElementById('save')
    const sessionsList = document.getElementById('sessionsList')
    const newSessionBtn = document.getElementById('newSession')
    const exportBtn = document.getElementById('export')
    const importBtn = document.getElementById('importBtn')
    const importFile = document.getElementById('importFile')
    const exportCSVBtn = document.getElementById('exportCSV')
    const printPdfBtn = document.getElementById('printPdf')
    const formError = document.getElementById('formError')
    const themeSelect = document.getElementById('themeSelect')

    // modal elements
    const editModal = document.getElementById('editModal')
    const modalCandidate = document.getElementById('modalCandidate')
    const modalGoal = document.getElementById('modalGoal')
    const modalReality = document.getElementById('modalReality')
    const modalOptions = document.getElementById('modalOptions')
    const modalWill = document.getElementById('modalWill')
    const modalSave = document.getElementById('modalSave')
    const modalCancel = document.getElementById('modalCancel')
    // history modal elements
    const historyModal = document.getElementById('historyModal')
    const historyList = document.getElementById('historyList')
    const historyClose = document.getElementById('historyClose')

    let sessions = load()
    let currentLoadedId = null

    function candidates(){
      const set = new Set(sessions.map(s=>s.candidate))
      return Array.from(set).filter(Boolean)
    }
    function renderCandidates(){
      const list = candidates()
      candidateSelect.innerHTML = ''
      const empty = document.createElement('option')
      empty.value=''
      empty.textContent='-- 選択してください --'
      candidateSelect.appendChild(empty)
      list.forEach(c=>{
        const o = document.createElement('option'); o.value=c; o.textContent=c; candidateSelect.appendChild(o)
      })
    }

    function renderSessions(){
      sessionsList.innerHTML=''
      const sel = candidateSelect.value
      const filtered = sel? sessions.filter(s=>s.candidate===sel) : sessions
      if(filtered.length===0){
        sessionsList.innerHTML = '<div style="padding:18px;border-radius:8px;background:#fbfdff;text-align:center;color:#234"><div style="font-weight:700">まだセッションがありません</div><div style="margin-top:8px;color:var(--muted)">候補者を追加して、GROWを試してみましょう</div><div style="margin-top:10px"><button id="emptyTry" class="btn secondary" type="button">候補者を追加して試す</button></div></div>'
        // attach handler after DOM created
        setTimeout(()=>{
          const btn = document.getElementById('emptyTry')
          if(btn) btn.onclick = ()=>{ newCandidate.focus(); newCandidate.value=''; }
        },10)
        return
      }
      filtered.slice().reverse().forEach(s=>{
        const div = document.createElement('div'); div.className='session-item'
        const left = document.createElement('div')
        left.innerHTML = `<div class="session-meta"><strong>${s.candidate}</strong> <small>${new Date(s.created).toLocaleString()}</small></div><div style="font-size:13px;color:#334;margin-top:8px">${s.goal||'<i>（Goal未入力）</i>'}</div>`
        const actions = document.createElement('div'); actions.className='actions'
        const historyBtn = document.createElement('button'); historyBtn.textContent='履歴'; historyBtn.onclick=()=>openHistoryModal(s.id)
        const editBtn = document.createElement('button'); editBtn.textContent='編集'; editBtn.onclick=()=>openEditModal(s.id)
        const loadBtn = document.createElement('button'); loadBtn.textContent='読み込み'; loadBtn.onclick=()=>loadSession(s.id)
        const delBtn = document.createElement('button'); delBtn.textContent='削除'; delBtn.className='secondary'; delBtn.onclick=()=>deleteSession(s.id)
        actions.appendChild(historyBtn); actions.appendChild(editBtn); actions.appendChild(loadBtn); actions.appendChild(delBtn)
        div.appendChild(left); div.appendChild(actions)
        sessionsList.appendChild(div)
      })
    }

    function loadSession(id){
      const s = sessions.find(x=>x.id===id)
      if(!s) return
      currentLoadedId = id
      candidateSelect.value = s.candidate
      goal.value = s.goal || ''
      reality.value = s.reality || ''
      optionsEl.value = s.options || ''
      will.value = s.will || ''
      saveBtn.textContent = 'セッションを更新'
      renderCandidates(); renderSessions()
    }

    function openEditModal(id){
      const s = sessions.find(x=>x.id===id)
      if(!s) return
      editModal.style.display = 'flex'
      editModal.setAttribute('aria-hidden','false')
      modalCandidate.value = s.candidate || ''
      modalGoal.value = s.goal || ''
      modalReality.value = s.reality || ''
      modalOptions.value = s.options || ''
      modalWill.value = s.will || ''
      // attach a one-time save handler
      modalSave.onclick = ()=>{
        const idx = sessions.findIndex(x=>x.id===id)
        if(idx === -1) return alert('セッションが見つかりません')
        // push previous snapshot into versions
        sessions[idx].versions = sessions[idx].versions || []
        sessions[idx].versions.push({
          savedAt: Date.now(),
          snapshot: Object.assign({}, sessions[idx])
        })
        // update
        sessions[idx] = Object.assign({}, sessions[idx], {
          candidate: modalCandidate.value.trim(),
          goal: modalGoal.value,
          reality: modalReality.value,
          options: modalOptions.value,
          will: modalWill.value
        })
        saveAll(sessions)
        alert('編集内容を保存しました')
        // if currently loaded in main form, update main form
        if(currentLoadedId === id){
          candidateSelect.value = sessions[idx].candidate
          goal.value = sessions[idx].goal
          reality.value = sessions[idx].reality
          optionsEl.value = sessions[idx].options
          will.value = sessions[idx].will
        }
        closeModal()
        renderCandidates(); renderSessions()
      }
      modalCancel.onclick = closeModal
    }

    function closeModal(){ editModal.style.display='none'; editModal.setAttribute('aria-hidden','true') }

    // History modal
    function openHistoryModal(id){
      const s = sessions.find(x=>x.id===id)
      if(!s) return
      historyList.innerHTML = ''
      const versions = (s.versions || []).slice().reverse()
      if(versions.length === 0){ historyList.innerHTML = '<small>履歴がありません。</small>' }
      versions.forEach((v, i)=>{
        const idxFromEnd = versions.length - 1 - i
        const d = document.createElement('div'); d.style.padding='8px'; d.style.borderBottom='1px solid #eee'
        const when = new Date(v.savedAt).toLocaleString()
        d.innerHTML = `<div><strong>${s.candidate}</strong> <small>${when}</small></div><div style="margin-top:6px;font-size:13px;color:#333">${(v.snapshot.goal||'<i>（Goalなし）</i>')}</div>`
        const btns = document.createElement('div'); btns.style.marginTop='8px'
        const restore = document.createElement('button'); restore.textContent='復元'; restore.onclick=()=>{
          if(!confirm('この履歴で現在のセッションを上書きします。よいですか？')) return
          const sidx = sessions.findIndex(x=>x.id===id)
          if(sidx === -1) return alert('セッションが見つかりません')
          // push current into versions
          sessions[sidx].versions = sessions[sidx].versions || []
          sessions[sidx].versions.push({ savedAt: Date.now(), snapshot: Object.assign({}, sessions[sidx]) })
          // restore snapshot
          const snapshot = v.snapshot
          sessions[sidx] = Object.assign({}, snapshot)
          saveAll(sessions)
          alert('履歴を復元しました')
          // sync if currently loaded
          if(currentLoadedId === id){ loadSession(id) }
          openHistoryModal(id)
        }
        const del = document.createElement('button'); del.textContent='削除'; del.className='secondary'; del.onclick=()=>{
          if(!confirm('このバージョンを削除しますか？')) return
          // remove specific version (need to find correct index in original versions array)
          const orig = sessions.find(x=>x.id===id)
          if(!orig || !orig.versions) return
          // versions were reversed for view, compute original index
          const origIdx = orig.versions.length - 1 - i
          orig.versions.splice(origIdx,1)
          saveAll(sessions)
          alert('バージョンを削除しました')
          openHistoryModal(id)
        }
        btns.appendChild(restore); btns.appendChild(del)
        d.appendChild(btns)
        historyList.appendChild(d)
      })
      historyModal.style.display = 'flex'
      historyModal.setAttribute('aria-hidden','false')
    }

    historyClose.onclick = ()=>{ historyModal.style.display='none'; historyModal.setAttribute('aria-hidden','true') }

    // Close modals with Escape
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape'){
        if(editModal.style.display==='flex') closeModal()
        if(historyModal.style.display==='flex'){ historyModal.style.display='none'; historyModal.setAttribute('aria-hidden','true') }
      }
    })

    function deleteSession(id){
      if(!confirm('このセッションを削除しますか？')) return
      sessions = sessions.filter(s=>s.id!==id)
      // clear loaded if we deleted it
      if(currentLoadedId === id){ currentLoadedId = null; saveBtn.textContent = 'セッションを保存' }
      saveAll(sessions); renderCandidates(); renderSessions()
    }

    addCandidateBtn.onclick = ()=>{
      const name = newCandidate.value.trim(); if(!name) return alert('候補者名を入力してください');
      // ensure exists
      if(!candidates().includes(name)){
        // create an empty session to register candidate
        sessions.push({id:uid(),candidate:name,goal:'',reality:'',options:'',will:'',created:Date.now()}); saveAll(sessions)
      }
      newCandidate.value=''; renderCandidates(); candidateSelect.value=name; renderSessions()
    }

    saveBtn.onclick = ()=>{
      formError.style.display='none'; formError.textContent=''
      const cand = (candidateSelect.value||'').trim()
      if(!cand){ formError.style.display='block'; formError.textContent='候補者を選択するか、新規候補者を追加してください。'; candidateSelect.focus(); return }
      if(currentLoadedId){
        const idx = sessions.findIndex(x=>x.id===currentLoadedId)
        if(idx !== -1){
          sessions[idx] = Object.assign({}, sessions[idx], {candidate:cand, goal:goal.value, reality:reality.value, options:optionsEl.value, will:will.value})
          saveAll(sessions); alert('更新しました')
        } else {
          // fallback: create new
          const s = {id:uid(),candidate:cand,goal:goal.value, reality:reality.value, options:optionsEl.value, will:will.value, created:Date.now()}
          sessions.push(s); saveAll(sessions); alert('保存しました')
        }
      } else {
        const s = {id:uid(),candidate:cand,goal:goal.value, reality:reality.value, options:optionsEl.value, will:will.value, created:Date.now()}
        sessions.push(s); saveAll(sessions); alert('保存しました')
      }
      renderCandidates(); candidateSelect.value=cand; renderSessions()
    }

    newSessionBtn.onclick = ()=>{
      if(!confirm('フォームをクリアして新規にしますか？')) return
      goal.value=''; reality.value=''; optionsEl.value=''; will.value=''; currentLoadedId = null; saveBtn.textContent = 'セッションを保存'
    }

    candidateSelect.onchange = ()=>{ renderSessions() }

    exportBtn.onclick = ()=>{
      const dataStr = JSON.stringify(sessions, null, 2)
      const blob = new Blob([dataStr], {type:'application/json'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a'); a.href=url; a.download='grow_sessions.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url)
    }

    importBtn.onclick = ()=> importFile.click()
    importFile.onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader(); reader.onload = ()=>{
        try{ const parsed = JSON.parse(reader.result); if(Array.isArray(parsed)){ sessions = sessions.concat(parsed); saveAll(sessions); renderCandidates(); renderSessions(); alert('インポート完了') }else alert('無効な形式です') }catch(err){ alert('読み込みエラー') }
      }; reader.readAsText(f)
      importFile.value=''
    }

    // CSV export (filtered by selected candidate if any)
    function toCSV(rows){
      const esc = v => '"' + String(v||'').replace(/"/g,'""') + '"'
      const header = ['id','candidate','created','goal','reality','options','will']
      const lines = [header.join(',')]
      rows.forEach(r=>{
        const row = [r.id, r.candidate, new Date(r.created).toISOString(), r.goal, r.reality, r.options, r.will].map(esc).join(',')
        lines.push(row)
      })
      return lines.join('\n')
    }

    exportCSVBtn.onclick = ()=>{
      const sel = candidateSelect.value
      const rows = sel? sessions.filter(s=>s.candidate===sel) : sessions
      if(rows.length===0) return alert('エクスポートするセッションがありません')
      const csv = toCSV(rows)
      const blob = new Blob([csv], {type:'text/csv'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a'); a.href = url; a.download = 'grow_sessions.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url)
    }

    // Print / PDF: 現在のフォーム入力内容を印刷
    printPdfBtn.onclick = ()=>{
      const cand = (candidateSelect.value||'').trim()
      const g = goal.value.trim()
      const r = reality.value.trim()
      const o = optionsEl.value.trim()
      const wi = will.value.trim()
      if(!cand && !g && !r && !o && !wi) return alert('印刷するフォーム内容がありません。フォームに入力してください。')
      const w = window.open('', '_blank')
      const html = []
      html.push('<!doctype html><html><head><meta charset="utf-8"><title>GROW 印刷</title>')
      html.push('<style>body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;padding:28px 32px;color:#222} h1{font-size:20px;border-bottom:2px solid #4f8cff;padding-bottom:8px;color:#4f8cff} h3{margin:18px 0 6px;color:#333} .val{white-space:pre-wrap;padding:6px 0;line-height:1.7} .meta{color:#666;font-size:14px;margin-bottom:12px} .empty{color:#999;font-style:italic}</style>')
      html.push('</head><body>')
      html.push('<h1>GROWモデル ワークシート</h1>')
      html.push('<div class="meta"><strong>候補者: </strong>' + (cand || '<span class="empty">未選択</span>') + '　　<strong>日時: </strong>' + new Date().toLocaleString() + '</div>')
      html.push('<h3>Goal（目標）</h3><div class="val">' + (g ? g.replace(/\n/g,'<br>') : '<span class="empty">（未入力）</span>') + '</div>')
      html.push('<h3>Reality（現状）</h3><div class="val">' + (r ? r.replace(/\n/g,'<br>') : '<span class="empty">（未入力）</span>') + '</div>')
      html.push('<h3>Options（選択肢／活用案）</h3><div class="val">' + (o ? o.replace(/\n/g,'<br>') : '<span class="empty">（未入力）</span>') + '</div>')
      html.push('<h3>Will（次の行動）</h3><div class="val">' + (wi ? wi.replace(/\n/g,'<br>') : '<span class="empty">（未入力）</span>') + '</div>')
      html.push('</body></html>')
      w.document.open(); w.document.write(html.join(''))
      w.document.close()
      setTimeout(()=>{ w.focus(); w.print(); }, 350)
    }

    // ステップ式フォームアニメーション
    const growFormPanel = document.getElementById('growFormPanel');
    const openFormBtn = document.getElementById('openFormBtn');
    let formOpen = false;
    let currentStep = 0;
    const stepPanels = [];
    function showStep(idx) {
      stepPanels.forEach((el, i) => {
        if(i === idx) {
          el.style.display = '';
          setTimeout(()=>el.classList.add('active'), 10);
        } else {
          el.classList.remove('active');
          setTimeout(()=>el.style.display = 'none', 400);
        }
      });
      currentStep = idx;
    }
    function openGrowForm() {
      if(formOpen) return;
      growFormPanel.style.maxHeight = growFormPanel.scrollHeight + 120 + 'px';
      growFormPanel.style.opacity = 1;
      formOpen = true;
      showStep(0);
    }
    function closeGrowForm() {
      growFormPanel.style.maxHeight = '0';
      growFormPanel.style.opacity = 0;
      formOpen = false;
      stepPanels.forEach(el=>{el.classList.remove('active'); el.style.display='none';});
    }
    if(openFormBtn) openFormBtn.onclick = openGrowForm;
    // ステップパネル取得
    document.addEventListener('DOMContentLoaded', ()=>{
      const panels = document.querySelectorAll('.step-panel');
      panels.forEach(p=>stepPanels.push(p));
      closeGrowForm();
      // 次へボタン
      document.querySelectorAll('.next-btn').forEach((btn, idx)=>{
        btn.onclick = ()=>{
          if(idx < stepPanels.length-1) showStep(idx+1);
        };
      });
    });
    // try button behavior
    const tryBtn = document.getElementById('tryBtn')
    if(tryBtn){ tryBtn.onclick = ()=>{ newCandidate.focus(); newCandidate.value=''; newCandidate.classList.add('pulse'); setTimeout(()=>newCandidate.classList.remove('pulse'),900) } }

    // small pulse animation for focus
    const s = document.createElement('style')
    s.textContent = `@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}} .pulse{animation:pulse .85s ease-in-out}`
    document.head.appendChild(s)

    // ripple effect for buttons
    function createRipple(e){
      const el = e.currentTarget
      const rect = el.getBoundingClientRect()
      const r = document.createElement('span')
      r.className = 'ripple'
      const size = Math.max(rect.width, rect.height)
      r.style.width = r.style.height = size + 'px'
      r.style.left = (e.clientX - rect.left - size/2) + 'px'
      r.style.top = (e.clientY - rect.top - size/2) + 'px'
      el.appendChild(r)
      r.style.animation = 'ripple .6s linear'
      setTimeout(()=> r.remove(), 650)
    }
    document.querySelectorAll('.btn, .secondary, .tryBtn').forEach(b=> b.addEventListener('click', createRipple))

    // toast helper
    const toast = document.createElement('div'); toast.id='toast'; document.body.appendChild(toast)
    function showToast(msg, ms=1400){ toast.textContent = msg; toast.style.display='block'; toast.style.opacity=''; setTimeout(()=>{ toast.style.opacity='0'; setTimeout(()=>toast.style.display='none', 350) }, ms) }

    // show toast on save instead of alert
    const origSave = saveBtn.onclick
    saveBtn.addEventListener('click', ()=>{
      // small delay to allow existing handler to run and save
      setTimeout(()=> showToast('保存しました'), 350)
    })

    // show toast on update via modal save
    if(modalSave) modalSave.addEventListener('click', ()=> setTimeout(()=> showToast('編集内容を保存しました'), 350))

    // === Iron Man HUD Canvas Animation ===
    (function(){
      const canvas = document.getElementById('hudCanvas');
      if(!canvas) return;
      canvas.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;';
      const ctx = canvas.getContext('2d');
      let w, h;
      function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      // particles
      const particles = [];
      for(let i=0;i<50;i++){
        particles.push({
          x: Math.random()*2000, y: Math.random()*2000,
          vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3,
          r: Math.random()*1.5+0.5,
          color: Math.random()>0.6 ? 'rgba(240,192,64,' : 'rgba(230,36,41,'
        });
      }
      function draw(){
        ctx.clearRect(0,0,w,h);
        // grid lines
        ctx.strokeStyle = 'rgba(240,192,64,0.02)';
        ctx.lineWidth = 0.5;
        for(let x=0;x<w;x+=80){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
        for(let y=0;y<h;y+=80){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
        // particles
        particles.forEach(p=>{
          p.x += p.vx; p.y += p.vy;
          if(p.x<0) p.x=w; if(p.x>w) p.x=0;
          if(p.y<0) p.y=h; if(p.y>h) p.y=0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
          ctx.fillStyle = p.color + (0.25+Math.random()*0.15) + ')';
          ctx.fill();
        });
        // connection lines
        for(let i=0;i<particles.length;i++){
          for(let j=i+1;j<particles.length;j++){
            const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
            const dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<120){
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = 'rgba(230,36,41,'+(0.06*(1-dist/120))+')';
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // トップへボタン：ページリロード
    const reloadBtn = document.getElementById('reloadBtn')
    if(reloadBtn){ reloadBtn.onclick = ()=> location.reload() }

    // 初期レンダリング
    renderCandidates(); renderSessions()
  </script>
</body>
</html>
